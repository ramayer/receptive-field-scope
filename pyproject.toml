[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "receptive-field-scope"
version = "0.4.0"
description = "Measure receptive fields of arbitrary PyTorch encoders/decoders (images, audio and video; gradient- and perturbation-based, support vs effective, per-direction, per-layer, alignment sweeps, tiling-margin validation) latent lesion studies and cut tests."
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
keywords = ["audio", "HuBERT", "receptive field", "effective receptive field", "autoencoder", "tokenizer", "vision transformer", "tiling", "latent lesion", "pytorch"]

# pip-style extras (pip install "receptive-field-scope[plots]")
[project.optional-dependencies]
plots = ["matplotlib"]
examples = ["compressai", "torchvision", "matplotlib", "transformers", "jupyter", "scikit-image"]

# uv-style dependency groups (PEP 735). `uv sync` / `uv run` include the `dev` group by default.
[dependency-groups]
dev = ["pytest", "matplotlib", "transformers"]
examples = ["compressai", "torchvision", "matplotlib", "transformers", "jupyter", "scikit-image"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]      # tests also work without installing the package; tests/toys.py is importable
markers = ["slow: slower tests (perturbation sweeps, position maps)"]
