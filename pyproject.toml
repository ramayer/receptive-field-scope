[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receptive-field-scope"
version = "0.1.0"
description = "Measure receptive fields of arbitrary PyTorch encoders/decoders (gradient- and perturbation-based, support vs effective, per-direction, per-layer, alignment sweeps, tiling-margin validation)."
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
keywords = ["receptive field", "effective receptive field", "autoencoder", "tokenizer", "vision transformer", "tiling", "pytorch"]

[project.optional-dependencies]
dev = ["pytest"]
examples = ["compressai", "torchvision", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
